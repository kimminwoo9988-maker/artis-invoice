<style>
  :root{
    --ink:#1a1a1a; --sub:#8a8f98; --line:#ececf0; --bg:#f4f5f7;
    --gold:#b8912f; --accent:#1a1a1a; --card:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif; background:var(--bg); color:var(--ink);}
  .wrap{max-width:460px; margin:0 auto; padding:16px 14px 60px;}
  h1{font-size:18px; margin:6px 2px 14px; letter-spacing:-.02em;}
  h1 span{color:var(--gold);}
  .panel{background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px;}
  .panel > .phead{display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none;}
  .phead b{font-size:14px;}
  .phead .chev{color:var(--sub); font-size:13px;}
  .field{margin-top:12px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:5px; letter-spacing:-.01em;}
  .field input, .field textarea{width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit; background:#fbfbfc; color:var(--ink);}
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--gold); background:#fff;}
  .row2{display:flex; gap:10px;} .row2 .field{flex:1;}
  .hint{font-size:11px; color:var(--sub); margin-top:5px;}
  .toggle{display:flex; gap:8px; margin-top:6px;}
  .toggle button{flex:1; border:1px solid var(--line); background:#fbfbfc; border-radius:10px; padding:9px; font-size:13px; color:var(--sub); cursor:pointer;}
  .toggle button.on{border-color:var(--gold); color:var(--ink); background:#fff; font-weight:600;}
  .itemrow{display:flex; gap:8px; margin-top:8px; align-items:center;}
  .itemrow .iname{flex:1.7;} .itemrow .iamt{flex:1;}
  .itemrow .delitem{flex:none; width:40px; height:44px; border:1px solid var(--line); background:#fff; border-radius:10px; color:#c0392b; font-size:22px; cursor:pointer; line-height:1;}
  .additem{margin-top:10px; width:100%; border:1px dashed var(--gold); background:#fff; color:var(--gold); border-radius:10px; padding:12px; font-size:14px; font-weight:600; cursor:pointer;}
  .logoRow{display:flex; align-items:center; gap:12px; margin-top:12px;}
  .logoPrev{width:52px; height:52px; border-radius:10px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; background:#fbfbfc; color:var(--sub); font-size:11px; flex:none;}
  .logoPrev img{width:100%; height:100%; object-fit:contain;}
  .btnrow{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;}
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.ghost{background:#fff; border:1px solid var(--line); color:var(--ink);}
  .btn.doc{width:100%; margin-top:10px; background:#faf8f2; border:1px solid #ecdfc0; color:#8a6d1f;}
  .btn:active{transform:translateY(1px);}
  .savednote{font-size:11px; color:#2a9d5c; margin-top:8px; height:14px; text-align:center;}

  /* ===== 청구서 카드 ===== */
  .previewWrap{display:flex; justify-content:center;}
  #invoice{width:380px; background:var(--card); color:#1a1a1a; padding:34px 30px 28px; position:relative;}
  #invoice .topbar{height:4px; background:linear-gradient(90deg,#b8912f,#e6c979,#b8912f); border-radius:3px; margin-bottom:24px;}
  #invoice .brand{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  #invoice .brand .lg{width:46px; height:46px; border-radius:9px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none;}
  #invoice .brand .lg img{width:100%; height:100%; object-fit:contain;}
  #invoice .brand .bn{font-size:20px; font-weight:800; letter-spacing:.04em;}
  #invoice .brand .bs{font-size:11px; color:#9a9aa2; letter-spacing:.22em; margin-top:2px;}
  #invoice .doctitle{font-size:12px; color:#b8912f; letter-spacing:.34em; font-weight:700; margin-bottom:2px;}
  #invoice .meta{display:flex; justify-content:space-between; font-size:11.5px; color:#8a8f98; margin-top:14px; padding-bottom:16px; border-bottom:1px solid #eee;}
  #invoice .meta b{color:#1a1a1a; font-weight:600;}
  #invoice .evt{margin:18px 0 6px;}
  #invoice .evt .l{font-size:11px; color:#9a9aa2; letter-spacing:.06em;}
  #invoice .evt .v{font-size:17px; font-weight:700; margin-top:4px; line-height:1.4;}
  #invoice .lines{margin-top:16px; border-top:1px solid #eee; padding-top:6px;}
  #invoice .lines .li{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; color:#4a4a52;}
  #invoice .lines .li .amt{font-variant-numeric:tabular-nums; color:#1a1a1a;}
  #invoice .lines .li.sub{border-top:1px solid #eee; margin-top:4px; padding-top:12px; color:#1a1a1a; font-weight:600;}
  #invoice .total{display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; padding-top:14px; border-top:2px solid #1a1a1a;}
  #invoice .total .tl{font-size:13px; font-weight:700;}
  #invoice .total .tv{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  #invoice .pay{margin-top:20px; background:#faf8f2; border:1px solid #f0e9d6; border-radius:10px; padding:13px 14px;}
  #invoice .pay .pt{font-size:10.5px; color:#b8912f; letter-spacing:.14em; font-weight:700; margin-bottom:6px;}
  #invoice .pay .pv{font-size:13px; font-weight:600; line-height:1.5;}
  #invoice .foot{margin-top:20px; padding-top:14px; border-top:1px solid #eee; font-size:11px; color:#8a8f98; line-height:1.7;}
  #invoice .foot .sig{text-align:right; margin-top:10px; font-size:12px; color:#1a1a1a; font-weight:600;}
  #invoice .stamp{position:absolute; right:26px; bottom:88px; font-size:10px; color:#c9a94a; border:1.5px solid #d8bf72; border-radius:50%; width:60px; height:60px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.25; transform:rotate(-12deg); letter-spacing:.02em; opacity:.9;}
  #invoice .stampimg{position:absolute; right:22px; bottom:74px; width:76px; height:76px; opacity:.92; transform:rotate(-8deg);}
  #invoice .brandlogo{height:30px; width:auto; max-width:230px;}

  /* ===== 화면 전환/버튼 ===== */
  .choose{display:flex; gap:10px; margin-top:18px;}
  .btn.big{padding:18px 12px; font-size:16px; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn.big .ci{font-size:20px;}
  .navbar{display:flex; align-items:center; justify-content:space-between; padding:2px 2px 14px; font-size:15px; font-weight:700; color:var(--ink);}
  .navbar .back{border:none; background:none; color:var(--gold); font-size:16px; font-weight:600; cursor:pointer; padding:6px 4px;}
  .navbar .sp{width:44px;}
  #imgScaler, #a4scaler{margin:0 auto; overflow:hidden;}
  #a4scaler{border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.08);}

  /* ===== A4 청구서 (PDF, 축소 표시) ===== */
  #a4{width:794px; min-height:1123px; background:#fff; color:#1a1a1a; padding:64px 60px; position:relative; font-size:14px;}
  #a4 .a4top{height:6px; background:linear-gradient(90deg,#b8912f,#e6c979,#b8912f); border-radius:3px;}
  #a4 .a4head{display:flex; justify-content:space-between; align-items:flex-start; margin-top:34px;}
  #a4 .a4brand{display:flex; align-items:center; gap:16px;}
  #a4 .a4brand .lg{width:64px; height:64px; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none;}
  #a4 .a4brand .lg img{width:100%; height:100%; object-fit:contain;}
  #a4 .a4brand .bn{font-size:30px; font-weight:800; letter-spacing:.04em;}
  #a4 .a4brand .bs{font-size:12px; color:#9a9aa2; letter-spacing:.24em; margin-top:4px;}
  #a4 .a4title{text-align:right;}
  #a4 .a4title .t{font-size:34px; font-weight:800; letter-spacing:.18em; color:#1a1a1a;}
  #a4 .a4title .kr{font-size:13px; color:#b8912f; letter-spacing:.3em; font-weight:700; margin-top:4px;}
  #a4 .a4info{display:flex; justify-content:space-between; margin-top:40px; gap:40px;}
  #a4 .a4info .box{flex:1;}
  #a4 .a4info .cap{font-size:11px; color:#b8912f; letter-spacing:.16em; font-weight:700; margin-bottom:8px;}
  #a4 .a4info .row{font-size:13.5px; line-height:1.9; color:#3a3a42;}
  #a4 .a4info .row b{color:#1a1a1a; font-weight:600;}
  #a4 table{width:100%; border-collapse:collapse; margin-top:40px; font-size:14px;}
  #a4 table th{background:#1a1a1a; color:#fff; font-weight:600; padding:13px 16px; text-align:left; font-size:12.5px; letter-spacing:.02em;}
  #a4 table th.r, #a4 table td.r{text-align:right; font-variant-numeric:tabular-nums;}
  #a4 table td{padding:15px 16px; border-bottom:1px solid #eee; color:#3a3a42;}
  #a4 table td.evtname{font-weight:600; color:#1a1a1a;}
  #a4 .a4evt{margin-top:30px; font-size:15px; font-weight:600; color:#1a1a1a;}
  #a4 .a4evt .cap2{color:#b8912f; font-size:11px; letter-spacing:.14em; font-weight:700; margin-right:8px;}
  #a4 .a4evt + table{margin-top:16px;}
  #a4 .a4sum{display:flex; justify-content:flex-end; margin-top:16px;}
  #a4 .a4sum .tbl{width:320px;}
  #a4 .a4sum .sr{display:flex; justify-content:space-between; padding:9px 4px; font-size:13.5px; color:#4a4a52;}
  #a4 .a4sum .sr .v{font-variant-numeric:tabular-nums; color:#1a1a1a;}
  #a4 .a4sum .tot{display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; padding:16px 4px 4px; border-top:2px solid #1a1a1a;}
  #a4 .a4sum .tot .l{font-size:15px; font-weight:700;}
  #a4 .a4sum .tot .v{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums;}
  #a4 .a4pay{margin-top:44px; background:#faf8f2; border:1px solid #f0e9d6; border-radius:12px; padding:20px 22px;}
  #a4 .a4pay .pt{font-size:11px; color:#b8912f; letter-spacing:.16em; font-weight:700; margin-bottom:8px;}
  #a4 .a4pay .pv{font-size:15px; font-weight:600;}
  #a4 .a4foot{position:absolute; left:60px; right:60px; bottom:56px; display:flex; justify-content:space-between; align-items:flex-end; padding-top:20px; border-top:1px solid #eee;}
  #a4 .a4foot .info{font-size:12px; color:#8a8f98; line-height:1.9;}
  #a4 .a4foot .info b{color:#1a1a1a; font-weight:600;}
  #a4 .a4sign{text-align:right; font-size:15px; color:#1a1a1a; font-weight:600; position:relative;}
  #a4 .a4sign .stampbig{display:inline-flex; align-items:center; justify-content:center; width:74px; height:74px; border:2px solid #d8bf72; color:#c9a94a; border-radius:50%; font-size:12px; text-align:center; line-height:1.3; transform:rotate(-10deg); margin-left:12px; vertical-align:middle;}
  #a4 .a4logo{height:50px; width:auto; max-width:340px;}
  #a4 .a4stampimg{width:92px; height:92px; opacity:.92; margin-left:14px; transform:rotate(-8deg); vertical-align:middle;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 화면 1: 입력 ===== -->
  <div id="screenInput">
    <h1><span>ARTIS</span> · 공연 청구서</h1>
    <div class="panel">
      <div class="phead"><b>공연 내용 입력</b></div>
      <div class="row2">
        <div class="field"><label>공연 날짜</label><input type="date" id="i_date"></div>
        <div class="field"><label>청구번호 (자동)</label><input id="i_no" placeholder="자동생성"></div>
      </div>
      <div class="field"><label>공연(행사)명</label><input id="i_evt" placeholder="예) OO시 신년음악회" oninput="render()"></div>
      <div class="field"><label>받는 곳 (선택)</label><input id="i_to" placeholder="예) OO문화재단 귀중" oninput="render()"></div>
      <div class="field">
        <label>금액</label>
        <input id="i_amt" inputmode="numeric" placeholder="숫자만 입력 (예: 3000000)" oninput="onAmt(this)">
        <div class="toggle">
          <button id="tg_supply" class="on" onclick="setMode('supply')">별도 (VAT별도)</button>
          <button id="tg_total" onclick="setMode('total')">합계 (VAT포함)</button>
        </div>
        <div class="hint" id="amtHint">공급가에 부가세 10%를 더해 합계를 계산합니다.</div>
      </div>
      <div class="field">
        <label>세부 산출 내역 (선택)</label>
        <div id="items"></div>
        <button class="additem" onclick="addItem()">＋ 내역 추가</button>
        <div class="hint">내역을 넣으면 청구서에 항목별로 표시되고, 합계가 공급가가 됩니다. 비워두면 위 ‘금액’만 사용해요.</div>
      </div>
      <div class="field"><label>비고 (선택)</label><input id="i_memo" placeholder="예) 출연진 4인 / 반주 포함" oninput="render()"></div>
    </div>

    <div class="choose">
      <button class="btn primary big" onclick="goImage()"><span class="ci">🖼️</span> 이미지 청구서</button>
      <button class="btn ghost big" onclick="goPDF()"><span class="ci">📄</span> PDF 청구서</button>
    </div>
    <div class="hint" style="text-align:center;margin-top:8px">이미지는 휴대폰용 카드, PDF는 A4 서식이에요.</div>
  </div>

  <!-- ===== 화면 2: 이미지 청구서 ===== -->
  <div id="screenImage" style="display:none">
    <div class="navbar"><button class="back" onclick="goInput()">‹ 수정</button><span>이미지 청구서</span><span class="sp"></span></div>
    <div class="previewWrap"><div id="imgScaler"><div id="invoice"></div></div></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="downloadImg()">저장</button>
      <button class="btn primary" onclick="shareImg()">발송 (메일·카톡)</button>
    </div>
    <button class="btn doc" onclick="shareDocs('shareNote')">📎 사업자등록증 / 통장사본 발송</button>
    <div class="savednote" id="shareNote"></div>
  </div>

  <!-- ===== 화면 3: PDF 청구서 ===== -->
  <div id="screenPDF" style="display:none">
    <div class="navbar"><button class="back" onclick="goInput()">‹ 수정</button><span>PDF 청구서 (A4)</span><span class="sp"></span></div>
    <div class="previewWrap"><div id="a4scaler"><div id="a4"></div></div></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="downloadPDF()">저장</button>
      <button class="btn primary" onclick="sharePDF()">발송 (메일·카톡)</button>
    </div>
    <button class="btn doc" onclick="shareDocs('pdfNote')">📎 사업자등록증 / 통장사본 발송</button>
    <div class="savednote" id="pdfNote"></div>
  </div>

</div>

/* 금액/모드 */
function onAmt(el){el.value=el.value.replace(/[^0-9]/g,''); render();}
function setMode(m){mode=m;
  document.getElementById('tg_supply').classList.toggle('on',m==='supply');
  document.getElementById('tg_total').classList.toggle('on',m==='total');
  document.getElementById('amtHint').textContent = m==='supply'
    ? '공급가에 부가세 10%를 더해 합계를 계산합니다.'
    : '입력 금액을 VAT 포함 최종 금액으로 표기합니다.';
  render();
}

/* 세부 산출 내역 */
function addItem(name,amt){
  var wrap=document.getElementById('items');
  var row=document.createElement('div'); row.className='itemrow';
  row.innerHTML='<input class="iname" placeholder="예) 출연료" oninput="render()">'+
                '<input class="iamt" inputmode="numeric" placeholder="금액" oninput="onItemAmt(this)">'+
                '<button class="delitem" onclick="delItem(this)" title="삭제">−</button>';
  wrap.appendChild(row);
  if(typeof name==='string') row.querySelector('.iname').value=name;
  if(amt) row.querySelector('.iamt').value=amt;
  render();
}
function delItem(btn){ btn.parentNode.parentNode.removeChild(btn.parentNode); render(); }
function onItemAmt(el){ el.value=el.value.replace(/[^0-9]/g,''); render(); }
function getItems(){
  var rows=document.querySelectorAll('#items .itemrow'), out=[];
  for(var i=0;i<rows.length;i++){
    var n=rows[i].querySelector('.iname').value.trim();
    var a=parseInt(rows[i].querySelector('.iamt').value||'0',10)||0;
    if(n||a) out.push({name:n,amt:a});
  }
  return out;
}
function calc(){
  var items=getItems(), base=0;
  if(items.length){ for(var i=0;i<items.length;i++) base+=items[i].amt; }
  else base=parseInt(document.getElementById('i_amt').value||'0',10)||0;
  var incl=(mode==='total');
  var supply, vat, total;
  if(incl){ supply=base; vat=0; total=base; }
  else { supply=base; vat=Math.round(base*0.1); total=base+vat; }
  return {items:items, supply:supply, vat:vat, total:total, incl:incl};
}

/* 청구번호 자동 */
function autoNo(dateStr){
  var d=dateStr?new Date(dateStr):new Date();
  var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2);
  return 'AR-'+y+m+day;
}
document.getElementById('i_date').addEventListener('change',function(){
  var no=document.getElementById('i_no'); if(!no.value)no.value=autoNo(this.value); render();
});
document.getElementById('i_no').addEventListener('input',render);

function fmtDate(s){if(!s)return '—'; var d=new Date(s); return d.getFullYear()+'. '+('0'+(d.getMonth()+1)).slice(-2)+'. '+('0'+d.getDate()).slice(-2);}

   '<div class="evt"><div class="l">공연(행사)명</div><div class="v">'+esc(evt)+'</div></div>'+
   (memo?'<div style="font-size:12px;color:#9a9aa2;margin-top:2px">'+esc(memo)+'</div>':'')+
   '<div class="lines">'+
     (d.items.length ? d.items.map(function(it){return '<div class="li"><span>'+esc(it.name||'항목')+'</span><span class="amt">'+won(it.amt)+'</span></div>';}).join('') : '')+
     '<div class="li'+(d.items.length?' sub':'')+'"><span>공급가액'+(d.incl?' <span style="color:#9a9aa2;font-weight:400">(VAT포함)</span>':'')+'</span><span class="amt">'+won(supply)+'</span></div>'+
     (d.incl?'':'<div class="li"><span>부가세 (10%)</span><span class="amt">'+won(vat)+'</span></div>')+
   '</div>'+
   '<div class="total"><span class="tl">합계 금액</span><span class="tv">'+won(total)+'</span></div>'+
   payHtml+
   '<div class="foot">'+footLines.map(esc).join('<br>')+
      '<div class="sig">'+esc(CONFIG.sign)+'</div>'+
   '</div>';
  document.getElementById('invoice').innerHTML=h;
  renderA4();
}

function esc(s){return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

/* ===== 화면 전환 ===== */
function showScreen(id){
  ['screenInput','screenImage','screenPDF'].forEach(function(s){
    document.getElementById(s).style.display=(s===id)?'block':'none';
  });
  window.scrollTo(0,0);
}
function goInput(){ showScreen('screenInput'); }
function goImage(){ render(); showScreen('screenImage'); fitScale('invoice','imgScaler',380); }
function goPDF(){ renderA4(); showScreen('screenPDF'); fitScale('a4','a4scaler',794); }

/* 미리보기를 화면 폭에 맞게 축소 표시 */
function fitScale(elId, holderId, baseW){
  var el=document.getElementById(elId), holder=document.getElementById(holderId);
  el.style.transform='none';
  var h=el.offsetHeight;
  var avail=holder.parentNode.clientWidth;
  var k=Math.min(1, avail/baseW);
  el.style.transformOrigin='top left';
  el.style.transform='scale('+k+')';
  holder.style.width=(baseW*k)+'px';
  holder.style.height=(h*k)+'px';
}
window.addEventListener('resize',function(){
  if(document.getElementById('screenImage').style.display!=='none') fitScale('invoice','imgScaler',380);
  if(document.getElementById('screenPDF').style.display!=='none') fitScale('a4','a4scaler',794);
});

/* 캡처: 축소(transform) 잠깐 해제하고 원본 크기로 캡처 */
function capture(elId, opts, cb){
  var el=document.getElementById(elId), prev=el.style.transform;
  el.style.transform='none';
  html2canvas(el,opts).then(function(c){ el.style.transform=prev; cb(c); })
    .catch(function(){ el.style.transform=prev; cb(null); });
}
function fileName(ext){var e=document.getElementById('i_evt').value.trim()||'청구서';var d=document.getElementById('i_date').value||'';return 'ARTIS_'+e.replace(/[\\/:*?"<>|]/g,'')+(d?'_'+d:'')+'.'+(ext||'png');}

/* ---- 이미지 청구서 ---- */
function downloadImg(){
  capture('invoice',{scale:3,backgroundColor:'#ffffff',useCORS:true},function(c){
    if(!c){note('shareNote','생성 실패, 다시 시도해 주세요');return;}
    var a=document.createElement('a');a.download=fileName('png');a.href=c.toDataURL('image/png');a.click();
    note('shareNote','✔ 이미지가 저장되었습니다');
  });
}
function shareImg(){
  note('shareNote','이미지 준비 중...');
  capture('invoice',{scale:3,backgroundColor:'#ffffff',useCORS:true},function(c){
    if(!c){note('shareNote','생성 실패, 다시 시도해 주세요');return;}
    c.toBlob(function(blob){ shareFile(blob, fileName('png'), 'shareNote'); },'image/png');
  });
}

/* ---- PDF 청구서 ---- */
function makePDF(cb){
  capture('a4',{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:794},function(c){
    if(!c){cb(null);return;}
    var pdf=new window.jspdf.jsPDF('p','mm','a4');
    var pw=210, ph=297, ih=c.height*pw/c.width; if(ih>ph)ih=ph;
    pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,pw,ih,'','FAST');
    cb(pdf);
  });
}
function downloadPDF(){
  note('pdfNote','PDF 생성 중...');
  makePDF(function(pdf){ if(!pdf){note('pdfNote','생성 실패, 다시 시도해 주세요');return;}
    pdf.save(fileName('pdf')); note('pdfNote','✔ PDF가 저장되었습니다'); });
}
function sharePDF(){
  note('pdfNote','PDF 준비 중...');
  makePDF(function(pdf){ if(!pdf){note('pdfNote','생성 실패, 다시 시도해 주세요');return;}
    shareFile(pdf.output('blob'), fileName('pdf'), 'pdfNote'); });
}

/* 발송(공유) 공통 */
function shareFile(blob, name, noteId){
  var file=new File([blob], name, {type:blob.type||'application/octet-stream'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'ARTIS 공연 청구서',text:document.getElementById('i_evt').value||'공연 청구서'})
      .then(function(){note(noteId,'✔ 발송 창을 열었어요');})
      .catch(function(){note(noteId,'');});
  }else{
    var a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);a.click();
    note(noteId,'이 브라우저는 직접 발송을 지원하지 않아 저장했어요. (휴대폰에서 발송 권장)');
  }
}
function note(id,t){var n=document.getElementById(id);if(n){n.textContent=t;setTimeout(function(){n.textContent='';},3500);}}

/* 사업자등록증 / 통장사본 발송 */
function dataURLtoFile(durl, name){
  var arr=durl.split(','), mime=(arr[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
  var bstr=atob(arr[1]), n=bstr.length, u8=new Uint8Array(n);
  while(n--) u8[n]=bstr.charCodeAt(n);
  return new File([u8], name, {type:mime});
}
function shareDocs(noteId){
  try{
    var f1=dataURLtoFile(DOC_BIZ,'아르티스_사업자등록증.jpg');
    var f2=dataURLtoFile(DOC_BANK,'아르티스_통장사본.jpg');
    var files=[f1,f2];
    if(navigator.canShare && navigator.canShare({files:files})){
      navigator.share({files:files,title:'아르티스 사업자등록증·통장사본',text:'아르티스 사업자등록증 및 통장사본입니다.'})
        .then(function(){note(noteId,'✔ 발송 창을 열었어요');})
        .catch(function(){note(noteId,'');});
    }else{
      files.forEach(function(f){var a=document.createElement('a');a.download=f.name;a.href=URL.createObjectURL(f);a.click();});
      note(noteId,'이 브라우저는 직접 발송을 지원하지 않아 저장했어요. (휴대폰에서 발송 권장)');
    }
  }catch(e){ note(noteId,'문서 발송에 실패했어요. 다시 시도해 주세요.'); }
}
